<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar cliente: errores de validación · La Granja</title>
  <meta name="description" content="Estado de error del formulario de registro de clientes">
  <meta name="theme-color" content="#1F4E79">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/estilos.css">
  <script>document.documentElement.className+=" js";</script>
</head>
<body>
  <a class="enlace-salto" href="#contenido">Saltar al contenido</a>
  <header class="barra">
    <div class="barra__in">
      <a class="logo" href="index.html"><img src="img/logo.jpg" width="124" height="40" alt="Fruta Congelada La Granja, ir al inicio de sesión"></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu">Menú</button>
      <nav id="menu" class="menu" aria-label="Principal">
        <ul>
          <li><a href="inventario.html">Inventario</a></li><li><a href="en-construccion.html">Producción</a></li><li><a href="registrar-venta.html" aria-current="page">Ventas</a></li><li><a href="reportes.html">Reportes</a></li>
          <li class="usuario"><span>Carlos Gómez</span></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="contenido">
    <h1 id="titulo">Registrar cliente</h1>
    <section class="tarjeta tarjeta--form" aria-labelledby="titulo">
      <div class="aviso" role="alert">Revisa los campos marcados para poder guardar</div>
      <form id="form-cliente-errores" action="registrar-venta.html" method="get" novalidate>
        <label for="nombre">Nombre <span class="req" aria-hidden="true">*</span><span class="sr-only">(obligatorio)</span></label>
        <input id="nombre" type="text" maxlength="100" autocomplete="off" aria-invalid="true" aria-describedby="nombre-error">
        <p id="nombre-error" class="error">El nombre es obligatorio</p>
        <label for="documento">Documento <span class="req" aria-hidden="true">*</span><span class="sr-only">(obligatorio)</span></label>
        <input id="documento" type="text" maxlength="20" inputmode="numeric" autocomplete="off" value="900123456" aria-invalid="true" aria-describedby="documento-error">
        <p id="documento-error" class="error">Ese documento ya está registrado</p>
        <label for="telefono">Teléfono</label>
        <input id="telefono" type="tel" maxlength="20" autocomplete="tel" value="3101234567">
        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" maxlength="100" value="correo-invalido" aria-invalid="true" aria-describedby="correo-error" autocomplete="email">
        <p id="correo-error" class="error">Escribe un correo válido, por ejemplo nombre@empresa.com</p>
        <label for="direccion">Dirección</label>
        <input id="direccion" type="text" maxlength="200" placeholder="Dirección del cliente" autocomplete="address-line1">
        <div class="fila-botones">
          <a class="btn btn--sec" href="registrar-venta.html">Cancelar</a>
          <button class="btn btn--confirmar" type="submit">Guardar</button>
        </div>
      </form>
    </section>
  </main>
  <footer>
    <p>La Granja</p>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
